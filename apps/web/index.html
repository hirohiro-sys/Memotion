<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f8f9fa" />
    <meta name="apple-mobile-web-app-title" content="Memotion" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memotion</title>
    <script>
      try {
        if (localStorage.getItem("memotion_theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
    <!--
      Umami の計測。外部の可変なスクリプトがメモと同じ権限で動かないよう、
      cloud.umami.is/script.js の固定版（2026-11-15 取得、sha256
      c11c9d29ac15ee26ef07059add176fd7db95acbf8e8bdb1a79796b0ffdb58f18）を
      public/umami.js に置いて同じオリジンで配り、送信先だけを Umami に向ける。
      計測は本番のホストだけ。クエリ（グループ ID など）とハッシュは送らない。
    -->
    <script
      defer
      src="/umami.js"
      data-website-id="669fc867-d6a1-41aa-8c6f-f3fa146448ed"
      data-host-url="https://gateway.umami.is"
      data-domains="line-memo-orchestrator.hirohiro-sys.workers.dev"
      data-exclude-search="true"
      data-exclude-hash="true"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
