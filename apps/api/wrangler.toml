name = "line-memo-orchestrator"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# LINE Login / session / Messaging。値はリポジトリに置かない。
# ローカル: .dev.vars / 本番: wrangler secret
# LINE_CHANNEL_ID
# LINE_CHANNEL_SECRET
# LINE_MESSAGING_CHANNEL_SECRET
# LINE_CHANNEL_ACCESS_TOKEN
# SESSION_SECRET
# APP_URL
# Notion（任意）。無ければ Notion に書かず、通知も送らない
# NOTION_TOKEN
# NOTION_DATA_SOURCE_ID
# LINE 通知の送り先（任意）。無ければ通知しない
# NOTIFY_LINE_USER_ID
# 通知の「他N件」から開く Notion のページ（任意）。無ければ APP_URL
# NOTION_VIEW_URL

# LINE 通知の時刻（JST）。空にするとその通知はオフ。変えたらデプロイする。
# TECH_WEEKLY は「曜日 時刻」（曜日は sun / mon / tue / wed / thu / fri / sat）。
[vars]
TECH_WEEKLY = "sun 20:00"
TODO_DAILY = "08:00"
SCHEDULE_DAILY = "20:00"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "line-memo-orchestrator"
database_id = "52233bb7-9a0f-4385-918d-54616c7338a2"
migrations_dir = "migrations"

# LINE の受信済みと、Web の再送の重複判定の記録。D1 を外したあとも二重保存を防ぐ。
# 本番の名前空間は手作業で作った（docs/backend-setup.md）。wrangler dev はローカルの KV を使う。
[[kv_namespaces]]
binding = "DEDUP"
id = "620d745394c74102a6300ef90cdc404d"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "line-memo-orchestrator-media"

# Workers AI。キーは置かない。モデル ID は daily-reports の client に固定する。
# ローカルにモデルは無い。remote は推論先だけで、D1 と R2 はローカルのまま。
[ai]
binding = "AI"
remote = true
