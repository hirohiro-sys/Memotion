name = "line-memo-orchestrator"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# LINE Login / session / Messaging。値はリポジトリに置かない。
# ローカル: .dev.vars / 本番: wrangler secret
# LINE_CHANNEL_ID
# LINE_CHANNEL_SECRET
# LINE_MESSAGING_CHANNEL_SECRET
# LINE_CHANNEL_ACCESS_TOKEN
# SESSION_SECRET
# APP_URL

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "line-memo-orchestrator"
database_id = "52233bb7-9a0f-4385-918d-54616c7338a2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "line-memo-orchestrator-media"

# Workers AI。キーは置かない。モデル ID は daily-reports の client に固定する。
# ローカルにモデルは無い。remote は推論先だけで、D1 と R2 はローカルのまま。
[ai]
binding = "AI"
remote = true
